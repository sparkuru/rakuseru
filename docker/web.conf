worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format structured escape=json
    '{"time":"$time_iso8601","remoteAddress":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytesSent":$body_bytes_sent,"requestTime":$request_time}';
  access_log /dev/stdout structured;

  map $http_x_forwarded_proto $rakuseru_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  map $uri $rakuseru_content_security_policy {
    ~^/api/ "";
    ~^/health/ "";
    ~^/openapi(?:/|$) "";
    default "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'";
  }

  upstream rakuseru_api {
    server api:3000;
    keepalive 16;
  }

  sendfile on;
  server_tokens off;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $rakuseru_forwarded_proto;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    add_header Content-Security-Policy $rakuseru_content_security_policy always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /api/ {
      proxy_pass http://rakuseru_api;
    }

    location /health/ {
      proxy_pass http://rakuseru_api;
    }

    location = /openapi {
      proxy_pass http://rakuseru_api;
    }

    location ^~ /openapi/ {
      proxy_pass http://rakuseru_api;
    }

    location /assets/ {
      try_files $uri =404;
      expires 1y;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
